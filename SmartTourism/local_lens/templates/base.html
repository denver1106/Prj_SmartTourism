<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Local Lens" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Bootstrap cho nhanh (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
    <!-- Header vàng -->
    <header class="sticky-top shadow-sm">
        <div class="topbar">
            <div class="container d-flex align-items-center gap-2">
                <form class="flex-grow-1 d-flex" method="post" action="{{ url_for('search') }}" enctype="multipart/form-data">
                    <input type="text"
                           class="form-control search-input"
                           name="search_text"
                           placeholder="Tìm gì đó đi..." />
                    <button class="btn btn-dark ms-2" type="submit" title="Search">
                        🔍
                    </button>
                </form>
                <div class="brand-tag d-none d-md-block">welcome to <b>Viet Nam</b></div>
            </div>
        </div>
    </header>

    <!-- Nội dung -->
    <main class="py-4">
        <div class="container">
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="alert alert-warning">{{ messages[0] }}</div>
            {% endif %}
            {% endwith %}
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
