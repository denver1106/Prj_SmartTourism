<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>SmartFood – Trang chủ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        
        :root { --primary: #ff6b00; --bg: #f8fafc; --text: #1e293b; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .page { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; margin-bottom: 20px;}
        .brand { font-size: 24px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px;}
        .nav-links a { color: #64748b; text-decoration: none; margin-left: 20px; font-weight: 600; transition: 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        .logout { color: #ef4444 !important; }

        /* Hero */
        .hero { background: linear-gradient(135deg, #fff7ed, #ffedd5); padding: 40px; border-radius: 24px; margin-bottom: 30px; text-align: center; }
        .hero h1 { margin: 10px 0; font-size: 32px; color: #431407; }
        .hero p { color: #9a3412; font-size: 16px; margin: 0; }
        
        /* Search Card */
        .card { background: var(--white); border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 24px; }
        .search-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-input { flex: 1; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; transition: 0.2s; }
        .search-input:focus { border-color: var(--primary); outline: none; }
        
        .primary-btn { background: var(--primary); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .primary-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .secondary-btn { background: #f1f5f9; color: #475569; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; }
        
        .filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
        select, input[type="number"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; }
        
        /* Collection Grid */
        .collection-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .col-card { padding: 20px; border-radius: 16px; color: white; cursor: pointer; transition: 0.3s; }
        .col-card:hover { transform: translateY(-3px); }
        .col-card h3 { margin: 0 0 5px 0; font-size: 18px; }
        .col-card p { margin: 0; font-size: 13px; opacity: 0.9; }

        .loader { display: none; text-align: center; margin: 10px; color: #666; font-size: 14px; }

        @media (max-width: 600px) { .filters { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="page">
    <nav class="navbar">
        <a href="/" class="brand"><span>🍲</span> SmartFood</a>
        <div class="nav-links">
            <a href="{{ url_for('user_page') }}">Tôi</a>
            <a href="{{ url_for('logout') }}" class="logout">Thoát</a>
        </div>
    </nav>

    <header class="hero">
        <div style="font-size: 13px; font-weight: 700; color: #ea580c; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;">SmartFood</div>
        <h1>Chào {{ user.name or "bạn" }}, <br>hôm nay ăn gì nhỉ?</h1>
        <p>Hãy để SmartFood gợi ý thông minh cho bạn nhé.</p>
    </header>

    <!-- FORM TÌM KIẾM -->
    <section class="card">
        <form action="{{ url_for('results_page') }}" method="get" onsubmit="return handleSearch(event)">
            <input type="hidden" name="lat" id="latInput">
            <input type="hidden" name="lon" id="lonInput">

            <div class="search-group">
                <input name="query" id="queryInput" class="search-input" placeholder="🔍 Bạn thèm món gì? (VD: phở, trà sữa...)" required>
                <button type="submit" class="primary-btn">Tìm</button>
            </div>

            <!-- Suggestion Text -->
            <div id="suggestBox" style="margin-bottom: 15px; display: none; background: #fff7ed; padding: 10px; border-radius: 8px; color: #c2410c; font-size: 14px; border: 1px solid #ffedd5;">
                ✨ <b>Gợi ý:</b> <span id="suggestText"></span>
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button type="button" class="secondary-btn" onclick="fetchSuggestion()">🎲 Gợi ý cho bạn</button>
                <!-- <button type="button" class="primary-btn" onclick="smartRecommend()" style="background:#4f46e5;">🤖 Gợi ý thông minh</button> -->
            </div>
            
            <div id="gpsStatus" class="loader">📍 Đang lấy tọa độ GPS...</div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            
            <div style="font-size: 14px; font-weight: 600; color: #64748b; margin-bottom: 10px;">Bộ lọc nâng cao ▼</div>
            <div class="filters">
                <div>
                    <label style="font-size:13px; color:#64748b;">Khoảng cách (km)</label>
                    <input name="max_distance" type="number" step="0.5" placeholder="Tất cả">
                </div>
                <div>
                    <label style="font-size:13px; color:#64748b;">Mức giá</label>
                    <select name="price_level">
                        <option value="">Tất cả</option>
                        <option value="cheap">Rẻ ($)</option>
                        <option value="medium">Vừa ($$)</option>
                        <option value="expensive">Sang ($$$)</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:13px; color:#64748b;">Loại quán</label>
                    <select name="tag">
                        <option value="">Tất cả</option>
                        <option value="noodle">Mì / Bún / Phở</option>
                        <option value="soup">Món nước</option>
                        <option value="rice">Cơm</option>
                        <option value="fast_food">Ăn nhanh</option>
                        <option value="drink">Đồ uống</option>
                        <option value="healthy">Healthy</option>
                    </select>
                </div>
            </div>
        </form>
    </section>

    <!-- CATEGORIES -->
    <div style="margin-bottom: 10px; font-weight: 700; color: #334155;">Chủ đề phổ biến</div>
    <div class="collection-grid">
        <div class="col-card" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
            <h3>Cơm trưa</h3>
            <p>No bụng chắc dạ</p>
        </div>
        <div class="col-card" style="background: linear-gradient(135deg, #ef4444, #b91c1c);">
            <h3>Món cay</h3>
            <p>Thách thức vị giác</p>
        </div>
        <div class="col-card" style="background: linear-gradient(135deg, #10b981, #047857);">
            <h3>Eat Clean</h3>
            <p>Sống khỏe mỗi ngày</p>
        </div>
    </div>
</div>

<script>
    // 1. Auto GPS
    window.onload = () => {
        if (!navigator.geolocation) {
            alert("Trình duyệt không hỗ trợ GPS");
            return;
        }
        document.getElementById("gpsStatus").style.display = "block";
        navigator.geolocation.getCurrentPosition(
            pos => {
                document.getElementById("latInput").value = pos.coords.latitude;
                document.getElementById("lonInput").value = pos.coords.longitude;
                document.getElementById("gpsStatus").innerHTML = "✅ GPS đã sẵn sàng";
                setTimeout(() => document.getElementById("gpsStatus").style.display = "none", 2000);
            },
            err => {
                document.getElementById("gpsStatus").innerHTML = "❌ Lỗi GPS: " + err.message;
            }
        );
    };

    function handleSearch(e) {
        if (!document.getElementById("latInput").value) {
            e.preventDefault();
            alert("Chưa lấy được vị trí GPS. Vui lòng chờ giây lát.");
            return false;
        }
        return true;
    }

    // 2. Gợi ý API
    async function fetchSuggestion() {
        const queryInput = document.getElementById("queryInput");
        const lat = document.getElementById("latInput").value || 0;
        const lon = document.getElementById("lonInput").value || 0;
        
        // Show loading placeholder
        queryInput.setAttribute("placeholder", "Đang suy nghĩ...");
        
        try {
            // Gửi tọa độ và nhận gợi ý (món ăn/tag)
            const res = await fetch(`/api/suggestion?lat=${lat}&lon=${lon}`);
            const data = await res.json();
            
            // Sửa lỗi: Đảm bảo kiểm tra data.ok và data.query
            if (data.ok && data.query) {
                queryInput.value = data.query;
                document.getElementById("suggestBox").style.display = "block";
                // Dùng data.reason để giải thích gợi ý
                document.getElementById("suggestText").innerText = data.reason || "Dựa trên sở thích của bạn";
            } else {
                // Hiển thị message nếu backend báo lỗi hoặc không tìm thấy món ăn
                alert(data.msg || "Không tìm thấy gợi ý món ăn phù hợp.");
            }
        } catch(e) {
            alert("Lỗi kết nối hoặc API");
        } finally {
            // Đặt lại placeholder sau khi hoàn thành
            queryInput.setAttribute("placeholder", "🔍 Bạn thèm món gì? (VD: phở, trà sữa...)");
        }
    }

    function smartRecommend() {
        const lat = document.getElementById("latInput").value;
        const lon = document.getElementById("lonInput").value;
        if (!lat) {
            alert("Vui lòng đợi lấy GPS xong.");
            return;
        }
        // Redirect to recommended filter
        window.location.href = `/recommend?lat=${lat}&lon=${lon}`; 
    }
</script>
</body>
</html>
