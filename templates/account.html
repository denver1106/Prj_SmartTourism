<!-- templates/account.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập / Đăng ký – SmartFood</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .status.error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #fecaca;
            margin: 0 auto 16px;
            max-width: 420px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .divider {
            height: 1px;
            width: 100%;
            background: #e5e7eb;
        }
    </style>
</head>

<body>
<div class="page">

    <!-- NAV -->
    <header class="navbar">
        <div class="nav-logo">
            <span class="icon">🍽️</span>
            <span class="brand-name">SmartFood</span>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-text">
            <div class="badge">
                <span class="badge-dot"></span>
                Đăng nhập hoặc tạo tài khoản
            </div>
            <h1>Bắt đầu sử dụng SmartFood</h1>
            <p class="subtitle">
                Gợi ý quán ăn theo vị trí – sở thích – thời tiết – lịch sử của bạn.
            </p>
        </div>
    </section>

    <!-- ERROR MESSAGE -->
    {% if error %}
    <div class="status error">
        <span class="status-dot"></span> {{ error }}
    </div>
    {% endif %}

    <!-- MAIN CARD -->
    <section class="account-wrapper">
        <div class="card account-card">

            <!-- LOGIN -->
            <div class="section-title">
                <span class="icon">🔐</span> Đăng nhập
            </div>

            <form method="post" action="{{ url_for('login') }}" style="margin-bottom:18px;">
                <div class="filter-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="you@example.com">
                </div>

                <div class="filter-group">
                    <label>Mật khẩu</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="primary-btn" style="width:100%; margin-top:10px;">
                    Đăng nhập
                </button>
            </form>

            <!-- SEPARATOR -->
            <div class="divider" style="margin: 20px 0;"></div>

            <!-- REGISTER -->
            <div class="section-title">
                <span class="icon">🆕</span> Tạo tài khoản mới
            </div>

            <form method="post" action="{{ url_for('register') }}">
                <div class="filter-group">
                    <label>Tên hiển thị</label>
                    <input type="text" name="name" required placeholder="Tên của bạn">
                </div>

                <div class="filter-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="you@example.com">
                </div>

                <div class="filter-group">
                    <label>Mật khẩu</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="secondary-btn" style="width:100%; margin-top:10px;">
                    Đăng ký & bắt đầu
                </button>
            </form>

        </div>
    </section>

</div>
</body>
</html>
