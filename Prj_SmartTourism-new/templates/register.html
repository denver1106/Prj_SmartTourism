<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - SmartFood</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Tương tự login.html */
        body { font-family: 'Inter', sans-serif; background: #ecfeff; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 20px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .brand { text-align: center; font-size: 26px; font-weight: 800; color: #0891b2; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; color: #475569; margin-bottom: 5px; font-weight: 600; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; box-sizing: border-box;}
        .input-group input:focus { border-color: #0891b2; outline: none; }
        .btn { width: 100%; padding: 12px; background: #0891b2; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px;}
        .btn:hover { background: #0e7490; }
        .link { text-align: center; margin-top: 20px; font-size: 14px; }
        .err { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand">🍽️ SmartFood</div>
        <h2 style="text-align: center; margin-top: 0; color: #1e293b;">Tạo tài khoản mới</h2>
        
        {% if error %}
        <div class="err">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="email@cua.ban">
            </div>
             <div class="input-group">
                <label>Tên hiển thị</label>
                <input type="text" name="username" required placeholder="VD: Cuong">
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" name="password" required placeholder="Tạo mật khẩu">
            </div>
            <button type="submit" class="btn">Đăng ký</button>
        </form>

        <a href="{{ url_for('login_google_redirect') }}" style="text-decoration:none;">
            <button class="btn google-btn">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20">
                Tiếp tục với Google
            </button>
        </a>

        <div class="link">
            Đã có tài khoản? <a href="{{ url_for('login') }}" style="color:#0891b2; font-weight:600;">Đăng nhập</a>
        </div>
    </div>
</body>
</html>
