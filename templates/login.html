<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - SmartFood</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #fef3c7;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .brand {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: #ff6b00;
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #475569;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: #ff6b00;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #ff6b00;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover { background: #ea580c; }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-weight: 600;
            color: #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            margin-top: 15px;
        }

        .google-btn:hover {
            background: #f3f4f6;
        }

        .err {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .link a {
            color: #ff6b00;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="auth-card">

        <div class="brand">🍽️ SmartFood</div>
        <h2 style="text-align:center;margin-top:0;color:#1e293b;">Đăng nhập</h2>

        {% if error %}
        <div class="err">⚠️ {{ error }}</div>
        {% endif %}

        <!-- FORM LOGIN EMAIL & PASSWORD -->
        <form method="POST">
            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="vidu@email.com">
            </div>

            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" name="password" required placeholder="••••••">
            </div>

            <button type="submit" class="btn">Vào ngay</button>
        </form>

        <!-- GOOGLE LOGIN BUTTON -->
        <a href="{{ url_for('login_google_redirect') }}" style="text-decoration:none;">
            <button class="btn google-btn">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20">
                Tiếp tục với Google
            </button>
        </a>

        <div class="link">
            Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký miễn phí</a>
        </div>
    </div>
</body>
</html>
